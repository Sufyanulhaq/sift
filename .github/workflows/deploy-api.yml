name: API container

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - Dockerfile
      - backend/**
      - samples/**
      - .github/workflows/deploy-api.yml

jobs:
  container:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: docker build -t sift-api .
      - name: Smoke test
        run: |
          docker run -d --name api -p 7860:7860 -e SIFT_ALLOWED_ORIGINS=http://localhost:3000 sift-api
          for i in $(seq 1 30); do curl -sf localhost:7860/api/health && break; sleep 2; done
          job=$(curl -sf -X POST localhost:7860/api/analyze/sample/hearth-and-oak-reviews.csv | python3 -c "import sys,json;print(json.load(sys.stdin)['jobId'])")
          for i in $(seq 1 60); do
            code=$(curl -s -o result.json -w "%{http_code}" localhost:7860/api/jobs/$job)
            [ "$code" = "200" ] && break
            sleep 2
          done
          python3 -c "import json;m=json.load(open('result.json'))['meta'];print(m);assert m['embedder']=='minilm'"
          docker logs api | tail -20
      - name: Smoke test with free Render limits
        run: |
          docker rm -f api
          docker run -d --name small -p 7861:10000 --memory 512m --cpus 0.1 -e PORT=10000 -e SIFT_EMBEDDER=lsa -e SIFT_MAX_RUNNING=1 sift-api
          for i in $(seq 1 90); do curl -sf localhost:7861/api/health && break; sleep 2; done
          job=$(curl -sf -X POST localhost:7861/api/analyze/sample/hearth-and-oak-reviews.csv | python3 -c "import sys,json;print(json.load(sys.stdin)['jobId'])")
          start=$(date +%s)
          for i in $(seq 1 150); do
            code=$(curl -s -o small.json -w "%{http_code}" localhost:7861/api/jobs/$job)
            [ "$code" = "200" ] && break
            sleep 2
          done
          echo "analysis took $(( $(date +%s) - start ))s"
          python3 -c "import json;m=json.load(open('small.json'))['meta'];print(m);assert m['embedder']=='lsa'"
          docker stats --no-stream small
          docker logs small | tail -20
