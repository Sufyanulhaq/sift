[project]
name = "sift-backend"
version = "0.1.0"
description = "Sift API: customer feedback analysis with sentiment, topics, trends and grounded summaries."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=1.11.0",
    "fastapi>=0.142.2",
    "fastembed>=0.8.1",
    "joblib>=1.6.0",
    "numpy>=2.4.6",
    "pydantic>=2.13.5",
    "python-multipart>=0.0.32",
    "scikit-learn>=1.9.1",
    "uvicorn[standard]>=0.54.0",
    "vadersentiment>=3.3.2",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
    "ruff>=0.16.10",
]

[tool.ruff]
line-length = 140

[tool.ruff.lint]
ignore = [
    "B008",    # FastAPI declares File() and Form() in parameter defaults by design
    "DTZ007",  # dates are parsed as calendar days, no time zone involved
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
